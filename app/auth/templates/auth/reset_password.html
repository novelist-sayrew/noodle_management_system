{% extends "todo/base.html" %}

{% block css %}
{% endblock %}

{% block content %}
<h2>パスワード再設定</h2>
<hr>
<form method="post" action="{{url_for('auth.reset_password')}}">
    {{form.hidden_tag()}}

    <div class="mb-3">
        {{form.password.label}}<br>
        {{form.password(size=32)}}
    </div>

    <div class="mb-3">
        {{form.confirm.label}}<br>
        {{form.confirm(size=32)}}
    </div>

    {{form.submit()}}
</form>
{% endblock %}
