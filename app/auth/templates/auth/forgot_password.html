{% extends "todo/base.html" %}

{% block content %}
<h2 class="mb-3">パスワード再設定</h2>
<hr>
<P class="mb-3" ><strong>登録されたメールアドレスに、ワンタイムパスワードを送信します。</strong></P>

<form method="post" action="{{url_for('auth.forgot_password')}}">
    <div class="mb-3">
        <label>登録メールアドレス</label>
        <input type="email" name="email" required>
    </div>

    <button type="submit">再設定メールを送信する</button>
</form>
{% endblock %}
